<style>
* {

}

body {

.container {

.card {

    transition: 0.3s;
}

.card:hover {
    transform: translateY(-6px);
    border-color: #5865f2;
}

.card h2 {
    color: white;
    font-size: 23px;
    margin-bottom: 15px;
}

.card p {
    color: #9299a9;
    font-size: 14px;
    margin-bottom: 22px;
}

.card a {
    display: inline-block;
    background: #5865f2;
    color: white;
    text-decoration: none;
    padding: 11px 25px;
    border-radius: 8px;
    font-size: 14px;
    transition: 0.3s;
}

.card a:hover {
    background: #4752c4;
}

@media(max-width: 550px) {
    .container {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
